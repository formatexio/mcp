name: Release

# Pushing a tag vX.Y.Z tests the code, builds the five binaries and attaches
# them, with checksums.txt, to a GitHub release.
#
# The tag must equal the server version (Version in internal/mcp/server.go).
# That version is a constant shared by the MCP handshake, /health and --version,
# so it cannot be injected at build time and the binaries are not built with
# -X. The "Check the tag" step stops a mislabeled release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./... -race -count=1

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w" -o "dist/$3" ./cmd/formatex-mcp
          }
          build linux   amd64 formatex-mcp-linux-amd64
          build linux   arm64 formatex-mcp-linux-arm64
          build darwin  amd64 formatex-mcp-darwin-amd64
          build darwin  arm64 formatex-mcp-darwin-arm64
          build windows amd64 formatex-mcp-windows-amd64.exe

      - name: Check the tag
        run: |
          got=$(dist/formatex-mcp-linux-amd64 --version)
          want="formatex-mcp ${GITHUB_REF_NAME}"
          if [ "$got" != "$want" ]; then
            echo "The binary reports \"$got\" but the tag is ${GITHUB_REF_NAME}." >&2
            echo "Set Version in internal/mcp/server.go and version in smithery.yaml, then tag again." >&2
            exit 1
          fi

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum formatex-mcp-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: formatex-mcp ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/formatex-mcp-linux-amd64
            dist/formatex-mcp-linux-arm64
            dist/formatex-mcp-darwin-amd64
            dist/formatex-mcp-darwin-arm64
            dist/formatex-mcp-windows-amd64.exe
            dist/checksums.txt
          body: |
            ## Install

            ### Download a binary

            | Platform | File |
            |---|---|
            | Linux x86_64 | `formatex-mcp-linux-amd64` |
            | Linux ARM64 | `formatex-mcp-linux-arm64` |
            | macOS Intel | `formatex-mcp-darwin-amd64` |
            | macOS Apple Silicon | `formatex-mcp-darwin-arm64` |
            | Windows x64 | `formatex-mcp-windows-amd64.exe` |

            Compare the SHA-256 of the file with the matching line of `checksums.txt`
            (`sha256sum <file>` on Linux, `shasum -a 256 <file>` on macOS), then make
            it executable and put it on your PATH, for example:

            ```bash
            chmod +x formatex-mcp-darwin-arm64
            mv formatex-mcp-darwin-arm64 /usr/local/bin/formatex-mcp
            ```

            ### go install (requires Go)

            ```bash
            go install github.com/formatexio/mcp/cmd/formatex-mcp@${{ github.ref_name }}
            ```

            The binary lands in `$(go env GOPATH)/bin`.

            ## Quick setup (Claude Desktop, local binary)

            ```json
            {
              "mcpServers": {
                "formatex": {
                  "command": "/usr/local/bin/formatex-mcp",
                  "env": { "FORMATEX_API_KEY": "fex_your_key_here" }
                }
              }
            }
            ```

            Get a key at https://formatex.io/dashboard/api-keys. Every other client,
            and the hosted endpoint `https://mcp.formatex.io/mcp` that needs no
            install, are covered in the [README](https://github.com/formatexio/mcp#readme)
            and at https://formatex.io/mcp.
